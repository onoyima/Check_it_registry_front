name: Deploy ProveOwnership Frontend

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: frontend-production
  cancel-in-progress: true

env:
  VITE_API_URL: https://api.proveownership.com/api
  VITE_API_BASE_URL: https://api.proveownership.com
  VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
  VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check frontend build env
        run: |
          [ -n "$VITE_PAYSTACK_PUBLIC_KEY" ] || echo "::warning::VITE_PAYSTACK_PUBLIC_KEY is empty; Paystack checkout will not work"
          [ -n "$VITE_GOOGLE_MAPS_API_KEY" ] || echo "::warning::VITE_GOOGLE_MAPS_API_KEY is empty; maps features will be disabled"

      - run: npm run build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy website
        run: |
          rsync -r --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ prove-deploy@${{ secrets.VPS_HOST }}:/home/proveownership.com/public_html/

      - name: Verify SPA rewrite
        run: |
          ssh -i ~/.ssh/deploy_key "prove-deploy@${{ secrets.VPS_HOST }}" \
            "test -f /home/proveownership.com/public_html/.htaccess && grep -q 'index.html' /home/proveownership.com/public_html/.htaccess && echo 'SPA rewrite (.htaccess) is in place'"
